<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="10"/>
  
  <!-- Full Stack Icon -->
  <rect x="120" y="50" width="60" height="40" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="5"/>
  <rect x="125" y="55" width="50" height="30" fill="#3b82f6" rx="2"/>
  
  <!-- Database Icon -->
  <ellipse cx="150" cy="120" rx="25" ry="15" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="125" y="120" width="50" height="20" fill="#3b82f6"/>
  
  <!-- Course Title -->
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">دورة Full Stack Web</text>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">تطوير شامل للمواقع</text>
</svg>
