<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#339933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d7d32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="10"/>
  
  <!-- Node.js Logo -->
  <circle cx="150" cy="80" r="40" fill="#ffffff" stroke="#339933" stroke-width="3"/>
  <text x="150" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#339933">Node.js</text>
  
  <!-- Server Icon -->
  <rect x="130" y="100" width="40" height="30" fill="#339933" rx="5"/>
  <rect x="135" y="105" width="30" height="20" fill="#ffffff" rx="2"/>
  
  <!-- Course Title -->
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">دورة Node.js Backend</text>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">تطوير الخوادم والـ APIs</text>
</svg>
