<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#10b981"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main content area -->
  <rect x="20" y="20" width="260" height="160" rx="10" fill="url(#gradient)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="240" height="40" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="150" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Tech Scope</text>
  
  <!-- Content sections -->
  <rect x="30" y="80" width="100" height="60" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="80" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">أجهزة</text>
  <text x="80" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Devices</text>
  
  <rect x="140" y="80" width="100" height="60" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="190" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">تقنية</text>
  <text x="190" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Tech</text>
  
  <rect x="250" y="80" width="20" height="60" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="260" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">+</text>
  
  <!-- Footer -->
  <rect x="30" y="150" width="240" height="20" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="150" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">متجر تقني متخصص</text>
</svg>
