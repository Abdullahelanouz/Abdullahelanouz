  <script>
    // Ensure Font Awesome icons load properly
    document.addEventListener('DOMContentLoaded', function() {
      // Force Font Awesome styles for social media icons
      const socialIcons = document.querySelectorAll('.social-link i');
      socialIcons.forEach(icon => {
        if (icon.classList.contains('fab')) {
          icon.style.fontFamily = '"Font Awesome 6 Brands"';
          icon.style.fontWeight = '400';
        } else if (icon.classList.contains('fas')) {
          icon.style.fontFamily = '"Font Awesome 6 Free"';
          icon.style.fontWeight = '900';
        }
        icon.style.fontStyle = 'normal';
        icon.style.textRendering = 'auto';
        icon.style.webkitFontSmoothing = 'antialiased';
      });

      // Check if Font Awesome loaded after 2 seconds
      setTimeout(function() {
        const testElement = document.createElement('i');
        testElement.className = 'fab fa-linkedin-in';
        testElement.style.position = 'absolute';
        testElement.style.left = '-9999px';
        document.body.appendChild(testElement);

        const computedStyle = window.getComputedStyle(testElement, ':before');
        const fontFamily = computedStyle.getPropertyValue('font-family');

        if (!fontFamily.includes('Font Awesome')) {
          console.warn('Font Awesome may not be loaded properly');
          // Force reload Font Awesome
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';
          document.head.appendChild(link);
        } else {
          console.log('Font Awesome loaded successfully');
        }

        document.body.removeChild(testElement);
      }, 2000);
    });
  </script>
